# Publishes a GitHub release with ask-first-for-claude.zip (claude.ai's upload),
# ask-first-for-chatgpt.zip (ChatGPT's upload), ask-first-for-gemini.zip (Gemini's
# upload) and ask-first-for-other-ais.txt (the short version, to paste into other AIs).
# Every file is named for its app, and so is the folder it unzips into on a Mac, so
# someone who downloads several can tell them apart.
# Runs when .claude-plugin/plugin.json or this file changes on main. A new version
# gets a new release. A version that's already released gets its files and notes
# rebuilt from main and replaced, and files no longer built are removed; its tag
# doesn't move. To run it by hand (for example after fixing SKILL.md without a new
# version): Actions tab, Release, "Run workflow".
name: Release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # claude.ai rejects an upload whose name or description breaks these rules,
      # so check them here instead of finding out after the release is out.
      - name: Check SKILL.md against claude.ai's upload rules
        run: |
          skill=skills/ask-first/SKILL.md
          name="$(sed -n 's/^name: *//p' "$skill" | head -n 1)"
          description="$(sed -n 's/^description: *"\(.*\)"$/\1/p' "$skill" | head -n 1)"
          fail() { echo "::error file=$skill::$1"; exit 1; }
          [ -n "$description" ] || fail "No quoted description found in the frontmatter."
          case "$description" in *'<'* | *'>'*) fail "The description has < or >, which claude.ai rejects." ;; esac
          [ "${#description}" -le 1024 ] || fail "The description is ${#description} characters; claude.ai allows 1024."
          echo "$name" | grep -Eq '^[a-z0-9-]{1,64}$' || fail "The name must be 1 to 64 lowercase letters, digits or hyphens."
          case "$name" in *anthropic* | *claude*) fail "The name can't contain anthropic or claude." ;; esac
          version="$(jq -r .version .claude-plugin/plugin.json)"
          grep -qx "Version: $version" "$skill" || fail "SKILL.md's Version line doesn't say $version, the version in plugin.json."
          echo "SKILL.md passes: name $name, version $version, description ${#description} characters."

      # ChatGPT's custom instructions hold 1,500 characters on the Free and Go plans.
      - name: Check the paste-in prompt fits ChatGPT's smallest limit
        run: |
          n=$(wc -m < prompts/ask-first.txt)
          [ "$n" -le 1500 ] || { echo "::error file=prompts/ask-first.txt::$n characters; ChatGPT's Free plan allows 1500."; exit 1; }
          echo "prompts/ask-first.txt is $n characters."

      - name: Read the version
        id: version
        run: echo "tag=v$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      # claude.ai wants the skill's folder at the top of the zip. Naming that folder
      # ask-first-for-claude makes the zip unzip into a folder named for its app; the
      # skill's ID inside stays ask-first. (Chat Handoff ships the same way, and claude.ai
      # accepted it on November 3, 2026.)
      - name: Build ask-first-for-claude.zip
        run: |
          mkdir -p build && cp -R skills/ask-first build/ask-first-for-claude
          (cd build && zip -r -X "$GITHUB_WORKSPACE/ask-first-for-claude.zip" ask-first-for-claude)

      # Gemini needs the file named exactly SKILL.md, so it ships inside a zip named for
      # Gemini, at the top. Unzipped on a Mac, it lands in a folder named ask-first-for-gemini.
      - name: Build ask-first-for-gemini.zip
        run: cd skills/ask-first && zip -X "$GITHUB_WORKSPACE/ask-first-for-gemini.zip" SKILL.md

      # ChatGPT's plugin upload wants a manifest and skills/<name>/SKILL.md at the top.
      - name: Build ask-first-for-chatgpt.zip
        run: zip -r -X ask-first-for-chatgpt.zip .claude-plugin/plugin.json skills

      - name: Copy the short version for other AIs
        run: cp prompts/ask-first.txt ask-first-for-other-ais.txt

      - name: Write the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "**claude.ai:** download \`ask-first-for-claude.zip\` below, then upload it and turn it on under **Customize > Skills**."
            echo
            echo "**ChatGPT:** download \`ask-first-for-chatgpt.zip\` below and upload the zip as it is under **Customize > Plugins**, then start it with \`@ask-first\`. On a Mac, the zip holds a hidden \`.claude-plugin\` folder (the plugin's manifest) next to \`skills\`, so Finder shows only the skill; don't unzip it and zip it again. If Safari unzips it for you, download it again with right-click > **Download Linked File**, or with another browser."
            echo
            echo "**Gemini:** download \`ask-first-for-gemini.zip\` below and upload it under **Customize > Skills**, then start it with \`@ask-first\`. If your browser unzipped it into a folder named \`ask-first-for-gemini\`, upload the \`SKILL.md\` inside that folder instead."
            echo
            echo "**Microsoft 365 Copilot, Meta AI and other AIs:** download \`ask-first-for-other-ais.txt\` below and paste it into the AI's custom instructions or memory, or as the first message of a chat; see the [setup guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/setup.md)."
            echo
            echo "**Claude Code:** install it as a plugin; see the [README](https://github.com/${GITHUB_REPOSITORY}#claude-code)."
            echo
            echo "## What's new"
            awk -v h="## ${TAG#v}" 'index($0, h " ") == 1 || $0 == h {f=1; next} f && /^## / {exit} f' CHANGELOG.md
          } > notes.md

      - name: Publish the release, or replace a released version's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          files=(ask-first-for-claude.zip ask-first-for-chatgpt.zip ask-first-for-gemini.zip ask-first-for-other-ais.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Ask First ${TAG#v}" --notes-file notes.md
            exit 0
          fi
          echo "$TAG is already released; replacing its files and notes with this build."
          gh release upload "$TAG" "${files[@]}" --clobber
          keep=" $(for f in "${files[@]}"; do printf '%s ' "$(basename "$f")"; done)"
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            case "$keep" in
              *" $name "*) ;;
              *) echo "Removing $name, which this build no longer makes."; gh release delete-asset "$TAG" "$name" --yes ;;
            esac
          done
          gh release edit "$TAG" --notes-file notes.md
